import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id "com.android.library"
    id "kotlin-parcelize"
    id "org.jetbrains.kotlin.plugin.compose"
}

apply from: "${rootDir}/publish-module.gradle"


android {
    compileSdk 37
    defaultConfig {
        minSdk 23
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        compose true
    }


    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_21
            freeCompilerArgs.addAll(
                    "-Xopt-in=androidx.compose.material3.ExperimentalMaterial3Api",
                    "-Xopt-in=com.google.accompanist.pager.ExperimentalPagerApi",
            )
        }
    }
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
    namespace "github.leavesczy.matisse"
    lint {
        targetSdk 37
    }
    testOptions {
        targetSdk 37
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation "androidx.activity:activity-compose:1.13.0"
    def composeBom = platform("androidx.compose:compose-bom:2026.08.00")
    implementation composeBom
    androidTestImplementation composeBom
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    def accompanistVersion = "0.36.0"
    implementation "com.google.accompanist:accompanist-systemuicontroller:$accompanistVersion"
    implementation "com.google.accompanist:accompanist-pager:$accompanistVersion"
    def coilVersion = "3.5.0"
    implementation "io.coil-kt.coil3:coil-gif:$coilVersion"
    implementation "io.coil-kt.coil3:coil-compose:$coilVersion"
    implementation("io.coil-kt.coil3:coil-network-okhttp:$coilVersion")
    implementation "androidx.paging:paging-compose:3.5.1"
}